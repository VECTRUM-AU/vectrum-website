[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Override Netlify injected headers that break robots.txt validation
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    X-Robots-Tag = ""

# Serve app-ads.txt as plain text for AdMob crawler
[[headers]]
  for = "/app-ads.txt"
  [headers.values]
    Content-Type = "text/plain"
    X-Robots-Tag = ""

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Domain normalization — www and http both redirect to the canonical https, non-www host
[[redirects]]
  from = "https://www.vectrum.com.au/*"
  to = "https://vectrum.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://vectrum.com.au/*"
  to = "https://vectrum.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.vectrum.com.au/*"
  to = "https://vectrum.com.au/:splat"
  status = 301
  force = true

# Folder routes — explicit trailing-slash redirects instead of relying on Netlify's implicit default
[[redirects]]
  from = "/razum"
  to = "/razum/"
  status = 301

[[redirects]]
  from = "/sectordrop"
  to = "/sectordrop/"
  status = 301

# Clean URL redirects (so /privacy works as well as /privacy.html)
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
