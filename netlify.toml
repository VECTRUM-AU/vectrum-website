[build]
  publish = "."
  # Generates speedtest/testfile-*.bin. They are deliberately not committed:
  # random bytes do not belong in git, and the zero-filled file they replace
  # was compressible enough to falsify download measurements. See
  # tools/gen-speedtest-files.js.
  command = "node tools/gen-speedtest-files.js"

[functions]
  directory = "netlify/functions"

# No [edge_functions] block on purpose. Netlify's schema makes that an ARRAY
# of tables ([[edge_functions]] with path/function per entry) for manual
# routing, unlike [functions] which is a plain table — declaring it as a
# table fails the config parse before the build starts. None of it is needed:
# netlify/edge-functions/ is the default scan location, and the function
# declares its own route with `export const config = { path: ... }`.

# Speed-test payloads must never be served from a cache — a cached hit is
# read at disk speed and reports a throughput figure that has nothing to do
# with the radio. The app also appends a cache-busting query parameter; this
# is the belt to that pair of braces. Content-Type is pinned so the payloads
# stay outside any content-type-driven compression rule.
[[headers]]
  for = "/speedtest/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "no-store, no-cache, must-revalidate"

# Override Netlify injected headers that break robots.txt validation
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    X-Robots-Tag = ""

# Serve app-ads.txt as plain text for AdMob crawler
[[headers]]
  for = "/app-ads.txt"
  [headers.values]
    Content-Type = "text/plain"
    X-Robots-Tag = ""

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Domain normalization — www and http both redirect to the canonical https, non-www host
[[redirects]]
  from = "https://www.vectrum.com.au/*"
  to = "https://vectrum.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://vectrum.com.au/*"
  to = "https://vectrum.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.vectrum.com.au/*"
  to = "https://vectrum.com.au/:splat"
  status = 301
  force = true

# Folder routes — explicit trailing-slash redirects instead of relying on Netlify's implicit default
[[redirects]]
  from = "/razum"
  to = "/razum/"
  status = 301

[[redirects]]
  from = "/sectordrop"
  to = "/sectordrop/"
  status = 301

# Clean URL redirects (so /privacy works as well as /privacy.html)
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
