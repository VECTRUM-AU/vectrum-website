[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Override Netlify injected headers that break robots.txt validation
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    X-Robots-Tag = ""

# Serve app-ads.txt as plain text for AdMob crawler
[[headers]]
  for = "/app-ads.txt"
  [headers.values]
    Content-Type = "text/plain"
    X-Robots-Tag = ""

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Clean URL redirects (so /privacy works as well as /privacy.html)
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
